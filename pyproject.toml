[project]
name = "cmg-ingesta"
version = "0.1.0"
description = "Procesamiento de CMg de IVTE y de API CEN."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
cmg = "cmg_ingesta.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-openpyxl>=3.1.5.20260827",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F",   # errores básicos y de Python
    "I",        # TODO: busca en la documentación qué hace la regla "I"
    "B",        # TODO: y "B"
    "UP",       # modernizar sintaxis a la versión de Python
    "PD",       # TODO: esta es específica para ingeniería de datos, ¿de qué librería?
]

[tool.ruff.format]
exclude = ["*.md"]   # no reformatear los bloques de código de la documentación (comentarios alineados a propósito)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["cmg_ingesta"]
